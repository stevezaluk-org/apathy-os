# Name: early-boot.yaml
# Description: Used by initd to mount the root filesytsem before switch_rooting into new root
#
# Do not edit this file

mounts:
  - uuid: 94a2aa36-34be-4f9e-9dd7-cd5b8e54c985
    filesystemType: ext4
    mountPoint: /newroot
    readOnly: true
    priority: 1

  - uuid: 4e17b882-66db-4e21-a15c-ea4d24927b1d
    filesystemType: ext4
    mountPoint: /newroot/etc
    priority: 2

  - uuid: 811d9112-6f02-4086-8777-82386ebeb1f6
    filesystemType: ext4
    mountPoint: /newroot/var
    priority: 2

  - uuid: 7f801282-4fc2-47d0-b5c8-77d98bba0c4f
    filesystemType: ext4
    mountPoint: /newroot/mnt
    priority: 2

# Services will only ever start until all mounts are processed, so this is safe to execute
services:
  processes:
    - bin: "/usr/sbin/switch_root" # switch_root launches agentd which handles late setup and our event loop
      args:
      - "/root"
      - "/usr/sbin/agentd"
      exec: true

env:
  - key: PATH
    value: "/bin:/sbin:/tmp/bin:/usr/bin:/usr/sbin"
