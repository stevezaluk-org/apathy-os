image esp.vfat {
    vfat {
        file "EFI/BOOT/BOOTX64.EFI" {
            image = "EFI/BOOT/BOOTX64.EFI"
        }

        file "EFI/Linux/cloud-host_A.efi" {
            image = "EFI/Linux/cloud-host_A.efi"
        }

        file "loader/loader.conf" {
            image = "loader/loader.conf"
        }

        label = "boot-efi"
    }

    size = 300M
}

image disk.img {
    hdimage {
        partition-table-type = "gpt"
    }

    partition esp {
        partition-type-uuid = U
        image = "esp.vfat"
        size = 300M
        bootable = true
    }
}
