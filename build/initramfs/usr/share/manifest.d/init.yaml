# Name: early-boot.yaml
# Description: Used by initd to mount the root filesytsem before switch_rooting into new root
#
# Do not edit this file

mounts:
  - device: devtmpfs
    filesystemType: devtmpfs
    mountPoint: /dev
    priority: 1

  - device: proc
    filesystemType: proc
    mountPoint: /proc
    priority: 1

  - device: /rootfs.squashfs
    filesystemType: squashfs
    mountPoint: /newroot
    flags: ["ro"]
    loop: true
    priority: 2

# We don't persist anything on initramfs, so just log to stdout directly
log:
  local:
    stdout: true

env:
  - key: PATH
    value: "/usr/sbin:/usr/bin:/bin:/sbin"
