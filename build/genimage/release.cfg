image esp.vfat {
    vfat {
        file "EFI/BOOT/BOOTX64.EFI" {
            image = "EFI/BOOT/BOOTX64.EFI"
        }
        label = "boot-efi"
    }

    size = 300M
}

image rootfs.ext4 {
    ext4 {
        use-mke2fs = true
        extraargs = "-U 94a2aa36-34be-4f9e-9dd7-cd5b8e54c985"
        label = "rootfs"
    }

    size = 5G
    mountpoint = "/"
}

image etc.ext4 {
    ext4 {
        use-mke2fs = true
        extraargs = "-U 4e17b882-66db-4e21-a15c-ea4d24927b1d"
        label = "immutable-os_etc"
    }

    size = 5G
    mountpoint = "/etc"
}

image var.ext4 {
    ext4 {
        use-mke2fs = true
        extraargs = "-U 811d9112-6f02-4086-8777-82386ebeb1f6"
        label = "immutable-os_var"
    }

    size = 5G
    mountpoint = "/var"
}

image mnt.ext4 {
    ext4 {
        use-mke2fs = true
        extraargs = "-U 7f801282-4fc2-47d0-b5c8-77d98bba0c4f"
        label = "immutable-os_mnt"
    }

    size = 5G
    mountpoint = "/mnt"
}

image disk.img {
    hdimage {
        partition-table-type = "gpt"
    }

    partition esp {
        partition-type-uuid = U
        image = "esp.vfat"
        size = 300M
        bootable = true
    }

    partition root {
        partition-type-uuid = L
        image = "rootfs.ext4"
    }

    partition etc {
        partition-type-uuid = L
        image = "etc.ext4"
    }

    partition var {
        partition-type-uuid = L
        image = "var.ext4"
    }

    partition mnt {
        partition-type-uuid = L
        image = "mnt.ext4"
    }
}
