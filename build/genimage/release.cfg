image esp.vfat {
    vfat {
        file "EFI/BOOT/BOOTX64.EFI" {
            image = "EFI/BOOT/BOOTX64.EFI"
        }
        label = "boot-efi"
    }

    size = 300M
}

image rootfs.ext4 {
    ext4 {
        use-mke2fs = true
        extraargs = "-U 94a2aa36-34be-4f9e-9dd7-cd5b8e54c985"
        label = "rootfs"
    }

    size = 9G
    mountpoint = "/"
}

image disk.img {
    hdimage {
        partition-table-type = "gpt"
    }

    partition esp {
        partition-type-uuid = U
        image = "esp.vfat"
        size = 300M
        bootable = true
    }

    partition root {
        partition-type-uuid = L
        image = "rootfs.ext4"
    }
}
