[binaries]
c = 'gcc'
cpp = 'g++'
ar = 'ar'
strip = 'strip'
pkg-config = 'pkg-config'

[built-in options]
c_args = ['--sysroot=/build/sysroot']
c_link_args = ['--sysroot=/build/sysroot']
cpp_args = ['--sysroot=/build/sysroot']
cpp_link_args = ['--sysroot=/build/sysroot']

[properties]
sys_root = '/build/sysroot'
pkg_config_libdir = '/build/sysroot/usr/lib/pkgconfig'