version: 2

project_name: container-os-agent

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: "agent"
    main: "./cmd"
    binary: agent
    goos:
    - linux
    goarch:
    - amd64
    flags:
    - -v
    ldflags:
    - '-s -w'
    env:
    - CGO_ENABLED=0

archives:
  - id: binaries
    formats: ['binary']
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^build:"
      - "^style:"

release:
  footer: >-

    ---

    This may not work. Use at your own risk
