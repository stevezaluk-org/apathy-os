name: "release"
run-name: "container-os(): Build/Release ${{github.ref_name}}"

on:
  workflow_dispatch:
  push:
    tags:
      - "agent/v*"
      - "init/v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Derive release target from tag
        id: target
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          TARGET="${TAG%%/*}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "config=./${TARGET}/.goreleaser.yaml" >> "$GITHUB_OUTPUT"

          if [ ! -d "./${TARGET}" ]; then
            echo "Expected directory ./${TARGET} was not found"
            exit 1
          fi

          if [ ! -f "./${TARGET}/.goreleaser.yaml" ]; then
            echo "Expected GoReleaser config ./${TARGET}/.goreleaser.yaml was not found"
            exit 1
          fi

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --config "${{ steps.target.outputs.config }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}