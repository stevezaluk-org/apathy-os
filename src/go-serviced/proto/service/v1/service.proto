syntax = "proto3";

package service.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/immutable-os/immutable-os/src/go-serviced/protos/service/v1";

// Service Represents a system service that should be deployed
message Service {
  // name An arbitrary name for the service
  string name = 1;

  // description An arbitrary description for the service
  string description = 2;

  // exec An absolute Unix path to the binary that you want to execute
  string exec = 3;

  // args A list of arguments that should be passed to the service when it is started
  repeated string args = 4;

  // env Environment variables that the service should be started with
  repeated string env = 5;

  // pid The process ID of the running service
  uint64 pid = 6;

  // started_at The timestamp of when the service was started
  google.protobuf.Timestamp started_at = 7;

  // updated_at The timestamp of when the service was last updated
  google.protobuf.Timestamp updated_at = 8;
}

service Services {
  rpc Get(GetServiceRequest) returns (GetServiceResponse);
  rpc List(ListServiceRequest) returns (ListServiceResponse);
  rpc Start(StartServiceRequest) returns (StartServiceResponse);
  rpc Stop(StopServiceRequest) returns (StopServiceResponse);
}

message GetServiceRequest { string name = 1; }
message GetServiceResponse { Service service = 1; }

message ListServiceRequest {}
message ListServiceResponse { repeated Service service = 1; }

message StartServiceRequest { Service service = 1; }
message StartServiceResponse { uint64 pid = 1; bool started = 2; }

message StopServiceRequest { string name = 2; }
message StopServiceResponse { bool stopped = 1; }